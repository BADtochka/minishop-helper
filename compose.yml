services:
  bot:
    build: .
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - bot-data:/data
    stop_grace_period: 30s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  bot-data:
